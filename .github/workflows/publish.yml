name: Publish to npm

# Trusted publishing (OIDC): npm accepts this workflow's short-lived identity
# token instead of a stored token or a 2FA code.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and inspect without uploading'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      - name: Show package identity
        run: node -e "const p=require('./package.json');console.log(p.name+'@'+p.version, p.repository && p.repository.url)"

      - name: Smoke test the client module
        run: node --check client.js && node --check index.js

      - name: Pack (dry run)
        if: inputs.dry_run
        run: npm pack --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
